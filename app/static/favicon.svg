<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Kaagaz">
  <!--
    Kaagaz mark: a sheet of paper with a folded corner, and a check that says
    it has been done. The old mark was a rupee in a circle, which reads as
    "Indian currency" rather than "your paperwork, handled".

    Built for the size it is actually seen at. A browser tab is 16px, so the
    silhouette does the work: one cream sheet, one bold check. The ruled lines
    and the fold are the first things to go if the browser scales it down, and
    the shape still says "document" without them.
  -->
  <defs>
    <linearGradient id="kTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4C7C"/>
      <stop offset="1" stop-color="#1B3455"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#kTile)"/>

  <!-- the sheet -->
  <path d="M8 6h10l5 5v15a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z" fill="#FFFCF5"/>
  <!-- folded corner -->
  <path d="M18 6l5 5h-5V6z" fill="#E7DAC2"/>
  <!-- ONE heavy rule. Two thin rules were tried and turned to grey mush at
       tab-icon sizes; a single 2.4-unit rule survives. Keep this file in step
       with app/templates/_logo.html. -->
  <path d="M10 15.5h7" stroke="#AEB7C2" stroke-width="2.4" stroke-linecap="round"/>

  <!-- the check: a bold disc overlapping the sheet, thick enough to survive 16px -->
  <circle cx="21" cy="21.5" r="7" fill="#2F7A52"/>
  <path d="M17.6 21.6l2.4 2.4 4.4-4.7" fill="none" stroke="#FFFFFF"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
